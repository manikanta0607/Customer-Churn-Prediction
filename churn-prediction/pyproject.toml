[project]
name = "churn-prediction"
version = "1.0.0"
description = "End-to-end customer churn prediction: EDA, model comparison, cost-based thresholding and a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests", "app", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"app/streamlit_app.py" = ["E501"]  # long UI strings
"scripts/eda.py" = ["E501"]  # report template text
